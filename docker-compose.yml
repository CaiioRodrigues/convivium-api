services:
  postgres:
    image: postgres:17-alpine
    container_name: convivium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: convivium
      POSTGRES_PASSWORD: convivium
      POSTGRES_DB: convivium
      # Locale brasileiro para ordenacao correta de nomes com acento
      LANG: pt_BR.utf8
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convivium -d convivium"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP de desenvolvimento: captura todo e-mail enviado pela API
  # e mostra numa interface web, sem mandar nada para o mundo real.
  mailpit:
    image: axllent/mailpit:latest
    container_name: convivium-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interface web -> http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
